server {
    # Render injects $PORT; fall back to 10000 for local docker runs.
    listen 10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Long-lived cache for hashed bundles, no-cache for the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # This page is deliberately unlisted.
    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet";
        try_files $uri =404;
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ /index.html;
    }
}
